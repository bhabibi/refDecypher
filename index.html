  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "RolliDex",
        "url": "https://rollidex.com/",
        "logo": "https://rollidex.com/brand/icon-512.png"
      },
      {
        "@type": "WebSite",
        "name": "RolliDex",
        "url": "https://rollidex.com/",
        "logo": "https://rollidex.com/brand/icon-512.png"
      }
    ]
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --paper: #F6F4EF;
      --ink: #22211F;
      --ink-soft: #3A3632;
      --placeholder: #4A463F;
      --danger: #7A1F1F;
      --field: #FFFFFF;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.5;
    }

    .page {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2.5rem 1.25rem 2rem;
      text-align: center;
    }

    h1 {
      width: min(42rem, 100%);
      margin: 0 0 1.75rem;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .context {
      width: min(36rem, 100%);
      margin: 0 0 1.75rem;
      font-size: 1.125rem;
      line-height: 1.5;
      text-wrap: balance;
    }

    .form-wrap {
      width: min(32rem, 100%);
      text-align: left;
    }

    .email-label {
      display: block;
      margin: 0 0 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .email-row {
      display: flex;
      gap: 0.625rem;
      align-items: stretch;
    }

    .email-input {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      min-height: 3rem;
      padding: 0.75rem 0.875rem;
      font: inherit;
      color: var(--ink);
      background: var(--field);
      border: 2px solid var(--ink);
      border-radius: 0.625rem;
    }

    .email-input::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }

    .email-input:-webkit-autofill {
      -webkit-text-fill-color: var(--ink);
      box-shadow: 0 0 0 1000px var(--field) inset;
    }

    .submit-btn {
      flex: 0 0 auto;
      min-height: 3rem;
      min-width: 7.5rem;
      padding: 0.75rem 1.25rem;
      font: inherit;
      font-weight: 600;
      color: var(--paper);
      background: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 0.625rem;
      cursor: pointer;
    }

    .submit-btn:hover:not(:disabled) {
      background: #3A3834;
      border-color: #3A3834;
    }

    .submit-btn:disabled {
      background: var(--placeholder);
      border-color: var(--placeholder);
      color: var(--paper);
      cursor: default;
    }

    :focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .form-hint {
      margin: 0.75rem 0 0;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    .form-error {
      margin: 0.5rem 0 0;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--danger);
    }

    .form-error:empty { display: none; }

    .success-state {
      margin: 0;
      text-align: center;
      font-size: 1.125rem;
      line-height: 1.5;
      color: var(--ink);
    }

    .footer {
      flex: 0 0 auto;
      padding: 1rem 1.25rem 1.25rem;
      text-align: center;
    }

    .footer p {
      max-width: 40rem;
      margin: 0 auto;
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--ink-soft);
      text-wrap: balance;
    }

    @keyframes inputShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .shake { animation: inputShake 420ms ease; }

    @media (max-width: 36rem) {
      .email-row { flex-direction: column; }
      .submit-btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
    }

    @media (forced-colors: active) {
      .email-input,
      .submit-btn {
        border: 2px solid CanvasText;
      }
    }
  </style>
</head>
<body>

  <main class="page">
    <h1><img class="logo" src="/brand/lockup-horizontal.svg" width="1870" height="512" alt="RolliDex"></h1>

    <p class="context">Coming soon. Be the first to know when we launch.</p>

    <form id="notifyForm" class="form-wrap" novalidate>
      <div id="formContainer">
        <label class="email-label" for="emailInput">Email address</label>
        <div class="email-row">
          <input
            class="email-input"
            id="emailInput"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            inputmode="email"
            aria-describedby="formHint"
            aria-invalid="false"
            required
          >
          <button class="submit-btn" id="submitBtn" type="submit">Notify me</button>
        </div>
        <p class="form-hint" id="formHint">No spam. Just a heads up when we launch.</p>
        <p class="form-error" id="formError" role="alert"></p>
      </div>

      <p class="success-state" id="successState" role="status" tabindex="-1" hidden>You're on the list. We'll be in touch.</p>

      <noscript>
        <p class="form-hint">JavaScript is turned off, so this form cannot send your email address.</p>
      </noscript>
    </form>
  </main>

  <footer class="footer">
    <p>RolliDex is an independent educational reference tool and is not affiliated with, endorsed by, or sponsored by Rolex SA. Rolex is a registered trademark of Rolex SA.</p>
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuUazCdFPzCO2oBmnnH6W6SEFJnHz77QxGHFlxvRTwa5MUE4AjGriB-cvIvgXhn-U/exec";

    const form = document.getElementById("notifyForm");
    const emailInput = document.getElementById("emailInput");
    const submitBtn = document.getElementById("submitBtn");
    const formError = document.getElementById("formError");
    const formContainer = document.getElementById("formContainer");
    const successState = document.getElementById("successState");

    function showError(msg) {
      formError.textContent = msg;
      emailInput.setAttribute("aria-invalid", "true");
      emailInput.setAttribute("aria-describedby", "formHint formError");
    }

    function clearError() {
      formError.textContent = "";
      emailInput.setAttribute("aria-invalid", "false");
      emailInput.setAttribute("aria-describedby", "formHint");
    }

    function showSuccess() {
      formContainer.hidden = true;
      successState.hidden = false;
      successState.focus();
    }

    function validateEmail(val) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const val = emailInput.value.trim();
      clearError();

      if (!val) {
        emailInput.classList.remove("shake");
        void emailInput.offsetWidth;
        emailInput.classList.add("shake");
        emailInput.addEventListener("animationend", () => {
          emailInput.classList.remove("shake");
        }, { once: true });
        showError("Please enter your email address.");
        emailInput.focus();
        return;
      }

      if (!validateEmail(val)) {
        emailInput.classList.remove("shake");
        void emailInput.offsetWidth;
        emailInput.classList.add("shake");
        emailInput.addEventListener("animationend", () => {
          emailInput.classList.remove("shake");
        }, { once: true });
        showError("Please enter a valid email address.");
        emailInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: val,
          source: "rollidex.com",
          timestamp: new Date().toISOString()
        })
      })
      .then(() => showSuccess())
      .catch(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Notify me";
        showError("Something went wrong — try again in a moment.");
      });
    });
  </script>

</body>
</html>
