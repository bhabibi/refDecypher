<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RolliDex — Coming Soon</title>
  <meta name="description" content="RolliDex — The independent Rolex reference decoder. Every digit tells you something. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #C9A84C;
      --gold-glow:  rgba(201, 168, 76, 0.35);
      --bg:         #0D0D0D;
      --surface:    #141414;
      --text:       #F0EDE8;
      --text-muted: #6C6862;
      --hairline:   rgba(255,255,255,0.09);
      --serif:      'Playfair Display', Georgia, serif;
      --mono:       'DM Mono', 'Courier New', monospace;
      --sans:       'DM Sans', system-ui, sans-serif;
      --r-md:       14px;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      /* allow scroll on tiny screens, prevent sideways scroll */
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ── Background gradient veil ── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 100% 0%,   rgba(201,168,76,0.07)  0%, transparent 65%),
        radial-gradient(ellipse 55% 45% at 0%   100%, rgba(30,80,160,0.08)   0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Main layout — true vertical center ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      /* generous horizontal padding, moderate vertical padding */
      padding: clamp(40px, 8vh, 80px) clamp(20px, 6vw, 48px);
    }

    /* ── Fade-in animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .anim {
      opacity: 0;
      animation: fadeUp 650ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .anim-1 { animation-delay:   0ms; }
    .anim-2 { animation-delay: 160ms; }
    .anim-3 { animation-delay: 320ms; }
    .anim-4 { animation-delay: 520ms; }

    /* ── Brand block ── */
    .brand-block {
      margin-bottom: clamp(24px, 4vh, 40px);
    }

    .brand {
      font-family: var(--serif);
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--gold);
      margin-bottom: 14px;
      line-height: 1;
    }

    /* ── Gold dot ── */
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 0   0   var(--gold-glow); opacity: 1;    }
      50%       { box-shadow: 0 0 12px 5px var(--gold-glow); opacity: 0.7; }
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      display: inline-block;
      margin: 0 auto 14px;
      animation: dotPulse 3s ease-in-out infinite;
    }

    /* ── Tagline ── */
    .tagline {
      font-family: var(--mono);
      font-size: clamp(9px, 1.4vw, 11px);
      font-weight: 300;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Context line ── */
    .context-line {
      font-family: var(--mono);
      font-size: clamp(12px, 1.8vw, 14px);
      font-weight: 300;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: clamp(24px, 4vh, 36px);
    }

    /* ── Email form ── */
    .form-wrap {
      width: 100%;
      max-width: 480px;
    }

    .email-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .email-input {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: clamp(13px, 2vw, 16px);
      font-weight: 300;
      letter-spacing: 0.04em;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      color: var(--text);
      padding: clamp(14px, 2vh, 17px) 20px;
      outline: none;
      transition: border-color 250ms, box-shadow 250ms;
      /* prevents zoom-in on iOS (font-size must be >= 16px or we handle it another way) */
      font-size: max(16px, clamp(13px, 2vw, 16px));
    }

    .email-input::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    .email-input:focus {
      border-color: rgba(201,168,76,0.55);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.11);
    }

    .submit-btn {
      font-family: var(--sans);
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 500;
      letter-spacing: 0.03em;
      background: var(--gold);
      color: #0D0D0D;
      border: none;
      border-radius: var(--r-md);
      padding: clamp(14px, 2vh, 17px) clamp(22px, 3vw, 30px);
      cursor: pointer;
      white-space: nowrap;
      transition: background 200ms, opacity 200ms, transform 150ms;
      flex-shrink: 0;
    }

    .submit-btn:hover:not(:disabled) {
      background: #d9b85c;
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .form-hint {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 13px;
      letter-spacing: 0.02em;
    }

    .form-error {
      font-family: var(--sans);
      font-size: 12px;
      color: rgba(220, 80, 60, 0.9);
      margin-top: 9px;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    /* ── Shake animation ── */
    @keyframes inputShake {
      0%,  100% { transform: translateX(0);   }
      20%        { transform: translateX(-8px); }
      40%        { transform: translateX(8px);  }
      60%        { transform: translateX(-6px); }
      80%        { transform: translateX(6px);  }
    }

    .shake {
      animation: inputShake 420ms ease;
    }

    /* ── Success state ── */
    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .success-state.show {
      display: flex;
    }

    .success-check {
      font-size: 28px;
      color: var(--gold);
    }

    .success-text {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(18px, 3vw, 22px);
      color: var(--gold);
      line-height: 1.4;
    }

    /* ── Mobile: stack input + button under ~500px ── */
    @media (max-width: 500px) {
      .email-row {
        flex-direction: column;
        gap: 10px;
      }

      .submit-btn {
        width: 100%;
        padding: 16px 20px;
        font-size: 15px;
      }

      .email-input {
        width: 100%;
        padding: 16px 18px;
      }
    }

    /* ── Very small screens (iPhone SE, old Androids) ── */
    @media (max-height: 600px) {
      .brand {
        font-size: 26px;
        margin-bottom: 10px;
      }

      .dot {
        width: 6px;
        height: 6px;
        margin-bottom: 10px;
      }

      .tagline {
        font-size: 9px;
      }

      .context-line {
        margin-bottom: 18px;
      }

      .page {
        padding: 24px 20px;
      }
    }

    /* ── Large screens — give the form a touch more room ── */
    @media (min-width: 900px) {
      .form-wrap {
        max-width: 520px;
      }
    }
  </style>
</head>
<body>

  <main class="page">

    <!-- Brand -->
    <div class="brand-block anim anim-1">
      <div class="brand">RolliDex</div>
      <div class="dot"></div>
      <div class="tagline">The Independent Watch Reference Decoder</div>
    </div>

    <!-- Context line -->
    <p class="context-line anim anim-3">Be the first to know when we launch.</p>

    <!-- Email capture -->
    <div class="form-wrap anim anim-4">
      <div id="formContainer">
        <div class="email-row">
          <input
            class="email-input"
            id="emailInput"
            type="email"
            placeholder="your@email.com"
            autocomplete="email"
            spellcheck="false"
            inputmode="email"
          >
          <button class="submit-btn" id="submitBtn" type="button">Notify me</button>
        </div>
        <p class="form-hint">No spam. Just a heads up when we launch.</p>
        <p class="form-error" id="formError"></p>
      </div>

      <div class="success-state" id="successState">
        <div class="success-check">✓</div>
        <div class="success-text">You're on the list. We'll be in touch.</div>
      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuUazCdFPzCO2oBmnnH6W6SEFJnHz77QxGHFlxvRTwa5MUE4AjGriB-cvIvgXhn-U/exec";

    const emailInput    = document.getElementById("emailInput");
    const submitBtn     = document.getElementById("submitBtn");
    const formError     = document.getElementById("formError");
    const formContainer = document.getElementById("formContainer");
    const successState  = document.getElementById("successState");

    function showError(msg) {
      formError.textContent = msg;
      formError.classList.add("show");
    }

    function clearError() {
      formError.textContent = "";
      formError.classList.remove("show");
    }

    function showSuccess() {
      formContainer.style.transition = "opacity 350ms ease";
      formContainer.style.opacity = "0";
      setTimeout(() => {
        formContainer.style.display = "none";
        successState.classList.add("show");
      }, 350);
    }

    function validateEmail(val) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());
    }

    submitBtn.addEventListener("click", () => {
      const val = emailInput.value.trim();
      clearError();

      if (!validateEmail(val)) {
        emailInput.classList.remove("shake");
        void emailInput.offsetWidth;
        emailInput.classList.add("shake");
        emailInput.addEventListener("animationend", () => emailInput.classList.remove("shake"), { once: true });
        showError("Please enter a valid email address.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: val,
          source: "rollidex.com",
          timestamp: new Date().toISOString()
        })
      })
      .then(() => showSuccess())
      .catch(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Notify me";
        showError("Something went wrong — try again in a moment.");
      });
    });

    emailInput.addEventListener("keydown", e => {
      if (e.key === "Enter") submitBtn.click();
    });
  </script>

</body>
</html>
